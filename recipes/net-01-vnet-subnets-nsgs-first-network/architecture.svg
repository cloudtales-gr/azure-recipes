<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1400" height="760" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <text x="700" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">NET-01: three tiers, one NSG per subnet</text>
  <text x="700" y="72" text-anchor="middle" font-size="16" fill="#475569">Each tier may reach only the next one. DenyVnetInbound (priority 4000) stops everything else from inside the VNet.</text>

  <!-- Internet -->
  <rect x="40" y="300" width="150" height="70" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="115" y="342" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Internet</text>

  <!-- VNet -->
  <rect x="240" y="110" width="1120" height="520" rx="18" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="265" y="145" font-size="20" font-weight="700" fill="#1d4ed8">vnet-net01 · 10.10.0.0/16 · Sweden Central</text>
  <text x="1335" y="145" text-anchor="end" font-size="15" fill="#475569">private subnets: defaultOutboundAccess = false</text>

  <!-- subnets -->
  <g font-size="16" fill="#0f172a">
    <rect x="290" y="190" width="300" height="300" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="440" y="222" text-anchor="middle" font-size="19" font-weight="700">snet-web</text>
    <text x="440" y="246" text-anchor="middle" fill="#475569">10.10.1.0/24</text>
    <rect x="335" y="300" width="210" height="80" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="440" y="332" text-anchor="middle" font-weight="600">vm-web</text>
    <text x="440" y="356" text-anchor="middle" fill="#475569">10.10.1.4 · listens on 80</text>
    <text x="440" y="432" text-anchor="middle" font-weight="600" fill="#1d4ed8">nsg-web</text>
    <text x="440" y="455" text-anchor="middle" font-size="14" fill="#334155">100/110 allow 443, 80 from Internet</text>
    <text x="440" y="476" text-anchor="middle" font-size="14" fill="#b91c1c">4000 deny VirtualNetwork</text>

    <rect x="680" y="190" width="300" height="300" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="830" y="222" text-anchor="middle" font-size="19" font-weight="700">snet-app</text>
    <text x="830" y="246" text-anchor="middle" fill="#475569">10.10.2.0/24</text>
    <rect x="725" y="300" width="210" height="80" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="830" y="332" text-anchor="middle" font-weight="600">vm-app</text>
    <text x="830" y="356" text-anchor="middle" fill="#475569">10.10.2.4 · listens on 8080</text>
    <text x="830" y="432" text-anchor="middle" font-weight="600" fill="#c2410c">nsg-app</text>
    <text x="830" y="455" text-anchor="middle" font-size="14" fill="#334155">100 allow 8080 from 10.10.1.0/24</text>
    <text x="830" y="476" text-anchor="middle" font-size="14" fill="#b91c1c">4000 deny VirtualNetwork</text>

    <rect x="1030" y="190" width="300" height="300" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="1180" y="222" text-anchor="middle" font-size="19" font-weight="700">snet-data</text>
    <text x="1180" y="246" text-anchor="middle" fill="#475569">10.10.3.0/24</text>
    <rect x="1075" y="300" width="210" height="80" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="1180" y="332" text-anchor="middle" font-weight="600">vm-data</text>
    <text x="1180" y="356" text-anchor="middle" fill="#475569">10.10.3.4 · listens on 5432</text>
    <text x="1180" y="432" text-anchor="middle" font-weight="600" fill="#047857">nsg-data</text>
    <text x="1180" y="455" text-anchor="middle" font-size="14" fill="#334155">100 allow 5432 from 10.10.2.0/24</text>
    <text x="1180" y="476" text-anchor="middle" font-size="14" fill="#b91c1c">4000 deny VirtualNetwork</text>
  </g>

  <!-- allowed flows -->
  <path d="M190,335 L333,335" stroke="#15803d" stroke-width="3" marker-end="url(#g)"/>
  <text x="240" y="322" text-anchor="middle" font-size="14" fill="#15803d" font-weight="600">80, 443</text>
  <text x="115" y="395" text-anchor="middle" font-size="13" fill="#64748b">rule only: no public</text>
  <text x="115" y="413" text-anchor="middle" font-size="13" fill="#64748b">IP in this lab</text>
  <path d="M545,330 L723,330" stroke="#15803d" stroke-width="3" marker-end="url(#g)"/>
  <text x="634" y="306" text-anchor="middle" font-size="15" fill="#15803d" font-weight="700">8080 ✓</text>
  <path d="M935,330 L1073,330" stroke="#15803d" stroke-width="3" marker-end="url(#g)"/>
  <text x="1004" y="306" text-anchor="middle" font-size="15" fill="#15803d" font-weight="700">5432 ✓</text>

  <!-- blocked flows -->
  <path d="M545,365 L723,365" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#r)"/>
  <text x="634" y="390" text-anchor="middle" font-size="15" fill="#dc2626" font-weight="700">22 ✗</text>
  <path d="M440,490 C440,555 1180,555 1180,492" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#r)"/>
  <text x="810" y="600" text-anchor="middle" font-size="15" fill="#dc2626" font-weight="700">web → data 5432 ✗  (no skipping a tier)</text>

  <!-- tests -->
  <rect x="440" y="660" width="780" height="70" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="830" y="690" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">test.ps1 / test.sh → Azure Run Command → probes on vm-web and vm-app</text>
  <text x="830" y="714" text-anchor="middle" font-size="14" fill="#475569">no public IPs, no SSH sign-in: the VM agent runs the probe and returns the output</text>
</svg>
